<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekonomisk Statistik II – VT 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); color: #1F3864; font-weight: 800; text-align: center; margin-bottom: 10px; }
  p.sub { color: #666; text-align: center; margin-bottom: 48px; font-size: 1rem; }
  .cards { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; max-width: 800px; }
  a.card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 300px; padding: 40px 32px; border-radius: 20px;
    text-decoration: none; color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.13);
    transition: transform 0.18s, box-shadow 0.18s;
  }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.18); }
  a.card .icon { font-size: 3rem; margin-bottom: 18px; }
  a.card h2 { font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 8px; }
  a.card p { font-size: 0.88rem; opacity: 0.88; text-align: center; }
  .blue { background: linear-gradient(135deg, #1F3864, #2E75B6); }
  .green { background: linear-gradient(135deg, #1a5c38, #2e8b57); }
  footer { margin-top: 56px; color: #aaa; font-size: 0.82rem; text-align: center; }
</style>
</head>
<body>
  <h1>📊 Ekonomisk Statistik II</h1>
  <p class="sub">VT 2026 · 1ST861 · Välj hur du vill plugga</p>
  <div class="cards">
    <a class="card blue" href="/sammanfattning.html">
      <div class="icon">📖</div>
      <h2>Sammanfattning</h2>
      <p>Alla ämnen förklarade med intuition, formler och exempel</p>
    </a>
    <a class="card green" href="/flashcards.html">
      <div class="icon">🎴</div>
      <h2>Flashcards</h2>
      <p>57 interaktiva kort – testa dig själv och spåra vad du kan</p>
    </a>
  </div>
  <footer>Skapad med Claude · Ekonomisk Statistik II VT 2026</footer>
</body>
